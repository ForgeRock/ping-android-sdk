name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]

  push:
    branches:
      - master
      - develop

  # Allows maintainers to trigger the full CI against a fork PR by commenting /run-ci
  issue_comment:
    types: [created]

permissions: write-all

jobs:
  # Resolves head SHA and repo for all event types.
  # For issue_comment, also validates the /run-ci command and commenter permissions,
  # and reacts with 👀 to acknowledge the trigger.
  resolve-context:
    name: Resolve PR context
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/run-ci') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    outputs:
      head_sha: ${{ steps.ctx.outputs.head_sha }}
      head_repo: ${{ steps.ctx.outputs.head_repo }}
    steps:
      - name: React to /run-ci comment with 👀
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'eyes'
            });

      - name: Resolve head SHA and repo
        id: ctx
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'push') {
              core.setOutput('head_sha', context.sha);
              core.setOutput('head_repo', `${context.repo.owner}/${context.repo.repo}`);
            } else if (context.eventName === 'pull_request') {
              core.setOutput('head_sha', context.payload.pull_request.head.sha);
              core.setOutput('head_repo', context.payload.pull_request.head.repo.full_name);
            } else {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              core.setOutput('head_sha', pr.data.head.sha);
              core.setOutput('head_repo', pr.data.head.repo.full_name);
            }

  # Build and run unit tests
  build-and-test:
    name: Build and test
    needs: resolve-context
    uses: ./.github/workflows/build-and-test.yaml
    with:
      head_sha: ${{ needs.resolve-context.outputs.head_sha }}
      head_repo: ${{ needs.resolve-context.outputs.head_repo }}
    secrets:
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Run integration tests on emulators
  integration-tests:
    name: Integration tests
    if: ${{ vars.ENABLE_INTEGRATION_TESTS == 'true' }}
    needs: resolve-context
    uses: ./.github/workflows/integration-tests.yaml
    with:
      head_sha: ${{ needs.resolve-context.outputs.head_sha }}
      head_repo: ${{ needs.resolve-context.outputs.head_repo }}
    secrets:
      E2E_CONFIG: ${{ secrets.E2E_CONFIG }}
      DAVINCI_E2E_CONFIG: ${{ secrets.DAVINCI_E2E_CONFIG }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Build and sign BrowserStack test artifacts
  # Skip for dependabot and fork PRs (signing secrets unavailable for forks)
  browserstack-prepare-artifacts:
    name: Prepare device farm artifacts
    if: github.actor != 'dependabot[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - build-and-test
      - resolve-context
    uses: ./.github/workflows/browserstack-prepare-artifacts.yaml
    with:
      head_sha: ${{ needs.resolve-context.outputs.head_sha }}
      head_repo: ${{ needs.resolve-context.outputs.head_repo }}
    secrets:
      E2E_CONFIG: ${{ secrets.E2E_CONFIG }}
      DAVINCI_E2E_CONFIG: ${{ secrets.DAVINCI_E2E_CONFIG }}
      SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      SIGNING_ALIAS: ${{ secrets.SIGNING_ALIAS }}
      SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Execute e2e test cases in BrowserStack.
  # Runs in two batches of 2 to stay within the 3-parallel-session limit:
  #   Batch 1 (parallel): davinci + journey
  #   Batch 2 (parallel): oath + push  — starts only after both batch 1 jobs finish
  browserstack-davinci-run:
    name: Run tests in BrowserStack
    uses: ./.github/workflows/browserstack-davinci-run.yaml
    needs: browserstack-prepare-artifacts
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  browserstack-journey-run:
    name: Run tests in BrowserStack
    uses: ./.github/workflows/browserstack-journey-run.yaml
    needs: browserstack-prepare-artifacts
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  browserstack-oath-run:
    name: Run tests in BrowserStack
    uses: ./.github/workflows/browserstack-oath-run.yaml
    needs:
      - browserstack-davinci-results
      - browserstack-journey-results
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  browserstack-push-run:
    name: Run tests in BrowserStack
    uses: ./.github/workflows/browserstack-push-run.yaml
    needs:
      - browserstack-davinci-results
      - browserstack-journey-results
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Wait for BrowserStack davinci test run to finish and publish results
  browserstack-davinci-results:
    name: BrowserStack DaVinci Test Results
    uses: ./.github/workflows/browserstack-davinci-results.yaml
    needs: browserstack-davinci-run
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    with:
      browserstack-davinci-build-id: ${{ needs.browserstack-davinci-run.outputs.browserstack-davinci-build-id }}

  # Wait for BrowserStack journey test run to finish and publish results
  browserstack-journey-results:
    name: BrowserStack Journey Test Results
    uses: ./.github/workflows/browserstack-journey-results.yaml
    needs: browserstack-journey-run
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    with:
      browserstack-journey-build-id: ${{ needs.browserstack-journey-run.outputs.browserstack-journey-build-id }}

  # Wait for BrowserStack OATH test run to finish and publish results
  browserstack-oath-results:
    name: BrowserStack OATH Test Results
    uses: ./.github/workflows/browserstack-oath-results.yaml
    needs: browserstack-oath-run
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    with:
      browserstack-oath-build-id: ${{ needs.browserstack-oath-run.outputs.browserstack-oath-build-id }}

  # Wait for BrowserStack PUSH test run to finish and publish results
  browserstack-push-results:
    name: BrowserStack PUSH Test Results
    uses: ./.github/workflows/browserstack-push-results.yaml
    needs: browserstack-push-run
    secrets:
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
    with:
      browserstack-push-build-id: ${{ needs.browserstack-push-run.outputs.browserstack-push-build-id }}

  # Run Mend SCA Scan — skip for fork PRs (Mend credentials unavailable)
  mend-sca-scan:
    name: Mend SCA Scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: resolve-context
    uses: ./.github/workflows/mend-sca-scan.yaml
    with:
      head_sha: ${{ needs.resolve-context.outputs.head_sha }}
      head_repo: ${{ needs.resolve-context.outputs.head_repo }}
    secrets:
      MEND_EMAIL: ${{ secrets.MEND_EMAIL }}
      MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Run Mend SAST Scan — skip for fork PRs (Mend credentials unavailable)
  mend-sast-scan:
    name: Mend SAST Scan
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    needs: resolve-context
    uses: ./.github/workflows/mend-sast-scan.yaml
    with:
      head_sha: ${{ needs.resolve-context.outputs.head_sha }}
      head_repo: ${{ needs.resolve-context.outputs.head_repo }}
    secrets:
      MEND_EMAIL: ${{ secrets.MEND_EMAIL }}
      MEND_USER_KEY: ${{ secrets.MEND_USER_KEY }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

  # Generate and publish API docs — only on pushes to main branches, not on PRs
  docs:
    name: Docs
    if: github.event_name == 'push'
    uses: ./.github/workflows/docs.yaml

  # Calculate package sizes — not applicable for issue_comment (no PR merge ref available)
  package-sizes:
    name: Package Sizes
    if: github.event_name != 'issue_comment'
    uses: ./.github/workflows/package-sizes.yml

  # Post /run-ci result back to the PR as a comment and update the reaction
  notify:
    name: Notify /run-ci result
    if: always() && github.event_name == 'issue_comment' && needs.resolve-context.result != 'skipped'
    needs:
      - resolve-context
      - build-and-test
      - browserstack-oath-results
      - browserstack-push-results
      - mend-sca-scan
      - mend-sast-scan
    runs-on: ubuntu-latest
    steps:
      - name: Post result comment and update reaction
        uses: actions/github-script@v7
        with:
          script: |
            const results = [
              '${{ needs.build-and-test.result }}',
              '${{ needs.browserstack-oath-results.result }}',
              '${{ needs.browserstack-push-results.result }}',
              '${{ needs.mend-sca-scan.result }}',
              '${{ needs.mend-sast-scan.result }}',
            ];
            const allPassed = results.every(r => r === 'success' || r === 'skipped');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: allPassed
                ? `✅ \`/run-ci\` — CI passed. [View run](${runUrl})`
                : `❌ \`/run-ci\` — CI failed. [View run](${runUrl})`
            });
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: allPassed ? 'rocket' : '-1'
            });
