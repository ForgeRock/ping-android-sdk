name: Run integration tests on emulators

on:
  workflow_call:
    inputs:
      runs-on:
        description: Platform to execute on
        type: string
        default: ubuntu-latest
      testrail-run-id:
        description: TestRail Run ID
        type: string
    secrets:
      SLACK_WEBHOOK:
        description: Slack Notifier Incoming Webhook
        required: true
      CODECOV_TOKEN:
        description: Codecov token
        required: true
      TESTRAIL_USERNAME:
        description: TestRail username
        required: true
      TESTRAIL_API_KEY:
        description: TestRail API key
        required: true
      E2E_CONFIG:
        description: Variables for the e2e tests
        required: true
      DAVINCI_E2E_CONFIG:
        description: Variables for the DaVinci e2e tests
        required: true

jobs:
  integration-tests:
    runs-on: ${{ inputs.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        include:
           - api-level: 29
             target: default
             arch: x86_64
             channel: stable

           - api-level: "37.1"
             target: google_apis_playstore_ps16k
             arch: x86_64
             channel: canary

    steps:
      - name: Clone the repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}

      - name: Setup config file for e2e tests
        run: |
          echo "${{ secrets.E2E_CONFIG }}" > journey/src/main/assets/test_config.properties
          echo "${{ secrets.DAVINCI_E2E_CONFIG }}" > davinci/src/main/assets/davinci_test_config.properties

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Debug available Android SDK packages
        run: |
          echo "Check for: system-images;android-37.1;google_apis_playstore_ps16k;x86_64"
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --list --channel=3 | grep -E "system-images;android-37.1;google_apis_playstore_ps16k;x86_64" || true

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ matrix.api-level }}-${{ matrix.target }}-${{ matrix.arch }}-${{ matrix.channel }}

      - name: Start ADB server for API Level 37.1
        if: matrix.api-level == '37.1'
        run: |
          $ANDROID_HOME/platform-tools/adb start-server

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: ${{ matrix.channel }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: echo "Generated AVD snapshot for caching."

      - name: Update the testrail integration configuration
        run: |
          cat foundation/testrail/src/main/kotlin/com/pingidentity/testrail/TestRailClientConfig.kt
          sed -i -e "s/\"TESTRAIL_ENABLE\", \".*\"/\"TESTRAIL_ENABLE\", \"${{ vars.TESTRAIL_ENABLE }}\"/g" foundation/testrail/src/main/kotlin/com/pingidentity/testrail/TestRailClientConfig.kt
          sed -i -e "s/\"TESTRAIL_DEBUG\", \".*\"/\"TESTRAIL_DEBUG\", \"${{ vars.TESTRAIL_DEBUG }}\"/g" foundation/testrail/src/main/kotlin/com/pingidentity/testrail/TestRailClientConfig.kt
          sed -i -e "s/\"TESTRAIL_PROJECT_ID\", \".*\"/\"TESTRAIL_PROJECT_ID\", \"${{ vars.TESTRAIL_PROJECT_ID }}\"/g" foundation/testrail/src/main/kotlin/com/pingidentity/testrail/TestRailClientConfig.kt
          sed -i -e "s/\"TESTRAIL_RUN_ID\", \".*\"/\"TESTRAIL_RUN_ID\", \"${{ inputs.testrail-run-id }}\"/g" foundation/testrail/src/main/kotlin/com/pingidentity/testrail/TestRailClientConfig.kt
          sed -i -e "s/\"TESTRAIL_USERNAME\", \".*\"/\"TESTRAIL_USERNAME\", \"${{ secrets.TESTRAIL_USERNAME }}\"/g" foundation/testrail/src/main/kotlin/com/pingidentity/testrail/TestRailClientConfig.kt
          sed -i -e "s/\"TESTRAIL_API_KEY\", \".*\"/\"TESTRAIL_API_KEY\", \"${{ secrets.TESTRAIL_API_KEY }}\"/g" foundation/testrail/src/main/kotlin/com/pingidentity/testrail/TestRailClientConfig.kt

      - name: Execute integration tests
        timeout-minutes: 30
        continue-on-error: true
        env:
          TESTRAIL_ENABLE: ${{ vars.TESTRAIL_ENABLE }}
          TESTRAIL_DEBUG: ${{ vars.TESTRAIL_DEBUG }}
          TESTRAIL_URL: ${{ vars.TESTRAIL_URL }}
          TESTRAIL_PROJECT_ID: ${{ vars.TESTRAIL_PROJECT_ID }}
          TESTRAIL_RUN_ID: ${{ inputs.testrail-run-id }}
          TESTRAIL_USERNAME: ${{ secrets.TESTRAIL_USERNAME }}
          TESTRAIL_API_KEY: ${{ secrets.TESTRAIL_API_KEY }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: ${{ matrix.channel }}
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --rerun-tasks connectedDebugAndroidTestCoverage --stacktrace --no-daemon --continue

      - name: Publish test results
        if: success() || failure()
        uses: dorny/test-reporter@v2
        with:
          name: Integration tests results - API Level ${{ matrix.api-level }} - ${{ matrix.target }}
          path: '**/build/outputs/androidTest-results/**/TEST-*.xml'
          list-suites: all
          list-tests: failed
          fail-on-error: 'true'
          fail-on-empty: 'true'
          reporter: java-junit

      - name: Upload Android Test Report HTML
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-tests-report-${{ matrix.api-level }}-${{ matrix.target }}
          path: '**/build/reports/androidTests/connected/debug/**'

      - name: Find all coverage report files from all modules
        run: |
          echo "COVERAGE_REPORTS=$(echo $(printf '%s,' $(find . | grep test-coverage.xml)))" >> $GITHUB_ENV

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4.5.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ env.COVERAGE_REPORTS }}
          flags: integration-tests